# Activation: https://github.com/Disease-Prediction-ASET26/disease-prediction-ci/blob/main/README.md
name: CI
on:
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  workflow-lint:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.event.action != 'closed' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: Disease-Prediction-ASET26/disease-prediction-ci/actions/validate-workflows@71c3544937d01a29962ff0949906e1cd9953145d # pinned shared action
  secret-scan:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.event.action != 'closed' }}
    uses: Disease-Prediction-ASET26/disease-prediction-ci/.github/workflows/secret-scan.yml@76e94bd640d92a3ffbf20e9cd5914e22b5ca40cd # shared secret scan
    permissions:
      contents: read
  lint:
    if: ${{ ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.event.action != 'closed') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: package-lock.json
    - run: npm ci
    - run: npm run lint
  build:
    if: ${{ ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.event.action != 'closed') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: package-lock.json
    - run: npm ci
    - run: npm run build
  unit-test:
    if: ${{ ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.event.action != 'closed') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: package-lock.json
    - run: npm ci
    - run: npm run test -- --coverage
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() }}
      with:
        name: frontend-coverage
        path: coverage/lcov.info
        retention-days: 3
        if-no-files-found: warn
  integration-test:
    if: ${{ ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.event.action != 'closed') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: package-lock.json
    - run: npm ci
    - run: npm run test:integration
  sonarqube:
    if: ${{ ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.event.action != 'closed') && (vars.SONAR_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
    - build
    - unit-test
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: frontend-coverage
        path: coverage
    - name: Require SonarQube configuration
      env:
        SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        test -n "$SONAR_HOST_URL"
        test -n "$SONAR_PROJECT_KEY"
        test -n "$SONAR_TOKEN"
    - uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
      env:
        SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: |
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.sources=src
          -Dsonar.qualitygate.wait=true
          -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
  owasp:
    if: ${{ ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.event.action != 'closed') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: package-lock.json
    - run: npm ci
    - run: npm audit --audit-level=high
  containerize:
    name: containerize / scan
    if: ${{ !cancelled() && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name
      == github.repository) && github.event.action != 'closed') && !contains(needs.*.result,
      'failure') && !contains(needs.*.result, 'cancelled') && needs['workflow-lint'].result == 'success' && needs['secret-scan'].result == 'success' && (!(vars.SONAR_ENABLED
      == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || needs.sonarqube.result
      == 'success') }}
    needs:
    - workflow-lint
    - secret-scan
    - lint
    - build
    - unit-test
    - integration-test
    - sonarqube
    - owasp
    uses: Disease-Prediction-ASET26/disease-prediction-ci/.github/workflows/container.yml@f85ec3d7dc9b79e28b68822e5045823b46961ef5 # separate registry queues
    permissions:
      contents: read
      packages: write
      pull-requests: read
    with:
      build-artifact: ''
      dev-dockerfile: Dockerfile.dev
      production-dockerfile: Dockerfile.prod
      gitops-image-name: frontend
    secrets: inherit
  ci:
    if: ${{ always() && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name ==
      github.repository || github.event.pull_request.base.ref == 'main') && github.event.action != 'closed') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
    - workflow-lint
    - secret-scan
    - lint
    - build
    - unit-test
    - integration-test
    - sonarqube
    - owasp
    - containerize
    steps:
    - name: Require develop promotion to main
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        REPOSITORY: ${{ github.repository }}
      run: |
        if [[ "$EVENT_NAME" == "pull_request" && "$BASE_REF" == "main" && ( "$HEAD_REF" != "develop" || "$HEAD_REPO" != "$REPOSITORY" ) ]]; then
          echo "::error::PRs into main must come from this repository's develop branch."
          exit 1
        fi
    - uses: Disease-Prediction-ASET26/disease-prediction-ci/actions/ci-summary@71c3544937d01a29962ff0949906e1cd9953145d # pinned shared action
      with:
        needs: ${{ toJSON(needs) }}
        disabled: '{"sonarqube": "Main-only. Configure SONAR_HOST_URL, SONAR_PROJECT_KEY, SONAR_TOKEN and enable SONAR_ENABLED."}'
        enabled: ${{ format('["workflow-lint","secret-scan","lint","build","unit-test","integration-test","owasp","containerize","{0}"]', (vars.SONAR_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request') && 'sonarqube' || '') }}
